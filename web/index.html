<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<title>handremote</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
	<button type="button" class="who" id="open-diag"><span class="dot" id="dot"></span><b id="host">PC</b><span class="who-more">›</span></button>
	<div class="top-acts">
		<button type="button" id="open-term" class="chip" data-t="term"></button>
		<button type="button" id="open-files" class="chip" data-t="files"></button>
		<button type="button" id="open-devices" class="chip" data-t="devices" hidden></button>
		<button type="button" id="refresh" class="icon-btn" aria-label="Refresh">↻</button>
	</div>
</header>

<section id="term" hidden>
	<div class="fbar">
		<button type="button" class="chip shell" id="term-shell" data-t="term"></button>
		<span class="f-title"></span>
		<button type="button" class="chip back" id="t-close" data-t="back"></button>
	</div>
	<div class="term-screen" id="term-screen"></div>
	<div class="keys" id="term-keys"></div>
	<form class="typebar" id="term-form">
		<input id="term-type" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
		<button type="submit" class="chip" data-t="termRun"></button>
	</form>
</section>

<section id="files" hidden>
	<div class="fbar">
		<button type="button" class="icon-btn" id="f-up" aria-label="Up">‹</button>
		<span class="f-title" id="f-title"></span>
		<button type="button" class="icon-btn" id="f-upload" aria-label="Upload">⇪</button>
		<button type="button" class="chip back" id="f-close" data-t="back"></button>
	</div>
	<div class="files-list" id="files-list"></div>
	<input type="file" id="f-pick" multiple hidden>
</section>

<section id="devices" hidden>
	<div class="fbar">
		<span class="f-title" data-t="devicesTitle"></span>
		<button type="button" class="chip back" id="d-close" data-t="back"></button>
	</div>
	<div class="files-list" id="devices-list"></div>
</section>

<section id="diag" hidden>
	<div class="fbar">
		<span class="f-title" data-t="diag"></span>
		<button type="button" class="chip back" id="dg-close" data-t="back"></button>
	</div>
	<div class="files-list" id="diag-list"></div>
</section>

<main id="list" aria-live="polite">
	<p class="empty" id="loading" data-t="loading"></p>
</main>

<section id="viewer" hidden aria-modal="true" role="dialog">
	<div class="vbar">
		<span class="v-title" id="v-title"></span>
		<button type="button" class="icon-btn sound" id="v-sound"></button>
		<button type="button" class="icon-btn" id="v-mic" aria-pressed="false"></button>
		<button type="button" class="chip" id="v-fit"></button>
		<button type="button" class="icon-btn" id="v-drag" aria-pressed="false"></button>
		<button type="button" class="chip" id="v-sas" hidden>Ctrl+Alt+Del</button>
		<button type="button" class="chip back" id="v-close" data-t="back"></button>
	</div>
	<div class="stage" id="stage"><img id="screen" alt="" draggable="false"><svg id="cursor" hidden viewBox="0 0 16 24" aria-hidden="true"><path d="M1 1v19l5-5 3.5 7.5 3-1.4L9 13.6h7z"/></svg><button type="button" class="chip" id="v-zoom" hidden></button><button type="button" class="chip" id="v-select" aria-pressed="false" hidden></button><div class="v-status" id="v-status" hidden></div></div>
	<div id="drawer-scrim"></div>
	<aside id="drawer" aria-label="Windows"><div class="drawer-head" id="drawer-head"></div><div class="drawer-list" id="drawer-list"></div></aside>
	<div class="keys" id="keys"></div>
	<form class="typebar" id="typebar" autocomplete="off">
		<input id="type" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false">
		<button type="submit" class="chip" data-t="send"></button>
	</form>
	<div class="toast" id="toast" role="status" hidden></div>
	<div class="clip" id="clip" role="status" hidden><span id="clip-text"></span><button type="button" class="chip" id="clip-take" data-t="clipTake"></button><button type="button" class="icon-btn" id="clip-close" aria-label="Close">✕</button></div>
</section>

<section id="sheet" hidden role="dialog">
	<div class="sheet-card">
		<div class="sheet-head"><b id="sheet-title"></b><button type="button" class="icon-btn" id="sheet-close" aria-label="Close">✕</button></div>
		<dl id="sheet-body"></dl>
	</div>
</section>
<script src="app.js"></script>
</body>
</html>
